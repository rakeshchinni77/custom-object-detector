services:
  object-detector:
    build: .
    container_name: custom-object-detector
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Do not mount the host filesystem by default; the image contains the model
    # and application files as requested. Uncomment a volume below for local
    # development if you want live edits.
    # volumes:
    #   - .:/app:delegated
